services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ade}
      POSTGRES_USER: ${POSTGRES_USER:-ade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ade}
    ports:
      - "5432:5432"
    volumes:
      - ade_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ade}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ade}
      POSTGRES_USER: ${POSTGRES_USER:-ade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ade}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ADE_API_KEY: ${ADE_API_KEY:-}
      ADE_ALLOWED_ORIGINS: ${ADE_ALLOWED_ORIGINS:-http://localhost:8080}
    ports:
      - "8080:8080"

volumes:
  ade_pgdata:
